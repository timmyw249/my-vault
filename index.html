<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo Vault</title>
    <!-- PWA Capabilities for iOS -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vault">
    
    <style>
        :root {
            --bg-color: #0b0b0c;
            --card-bg: #1c1c1e;
            --accent-color: #0a84ff;
            --text-color: #ffffff;
            --danger-color: #ff453a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            background-color: var(--bg-color);
        }

        .screen.active {
            display: flex;
        }

        /* Header Layout */
        header {
            background-color: var(--card-bg);
            padding: 24px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2c2c2e;
        }

        h1 { font-size: 1.4rem; font-weight: 700; }

        .header-actions {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .icon-btn, .upload-lbl {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .text-danger { color: var(--danger-color); }
        .hidden { display: none !important; }

        /* Photo Gallery Grid Layout */
        .grid {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            padding: 3px;
        }

        .thumbnail-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%; /* Forces Uniform Perfect Squares */
            background-color: #141416;
            overflow: hidden;
        }

        .thumbnail-wrapper img, .thumbnail-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Selection Overlays */
        .thumbnail-wrapper.selectable::after {
            content: '';
            position: absolute;
            top: 8px;
            right: 8px;
            width: 22px;
            height: 22px;
            border: 2px solid white;
            border-radius: 50%;
            background: rgba(0,0,0,0.4);
        }

        .thumbnail-wrapper.selected::after {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* PIN Pad UI Screen */
        .pin-container {
            margin: auto;
            text-align: center;
            width: 280px;
        }

        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .dot {
            width: 14px;
            height: 14px;
            border: 2px solid #fff;
            border-radius: 50%;
        }

        .dot.filled { background-color: #fff; }

        .pin-keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .key {
            background-color: var(--card-bg);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 72px;
            height: 72px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .key:active { background-color: #3a3a3c; }
        .key.action-btn { font-size: 1.2rem; background: none; }

        /* Immersive Fullscreen Media Viewer */
        .viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .viewer-btn {
            position: absolute;
            top: 44px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: none;
            font-size: 2rem;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            z-index: 2010;
        }

        #viewer-content img, #viewer-content video {
            max-width: 100%;
            max-height: 100vh;
        }
    </style>

    <!-- CRITICAL CORE SCRIPTS IN HEAD FOR FORCED RUNNING -->
    <script>
        window.currentPin = "1234";
        window.pinInput = "";
        window.isSelectMode = false;
        window.selectedIds = new Set();
        window.db = null;

        // Pull saved configurations immediately
        try {
            if (localStorage.getItem("vault_pin")) {
                window.currentPin = localStorage.getItem("vault_pin");
            } else {
                localStorage.setItem("vault_pin", "1234");
            }
        } catch (e) {
            console.log("Storage access restriction bypassed.");
        }

        // Setup Local Database Engine
        var dbRequest = indexedDB.open("PhotoVaultDB", 1);
        dbRequest.onupgradeneeded = function(e) {
            var localDb = e.target.result;
            if (!localDb.objectStoreNames.contains("media")) {
                localDb.createObjectStore("media", { keyPath: "id", autoIncrement: true });
            }
        };
        dbRequest.onsuccess = function(e) { 
            window.db = e.target.result; 
            loadGallery(); 
        };

        // Keypad Interactions
        function pressKey(num) {
            if (window.pinInput.length < 4) {
                window.pinInput += num;
                updateDots();
                if (window.pinInput.length === 4) {
                    setTimeout(verifyPin, 100);
                }
            }
        }

        function clearPin() {
            window.pinInput = "";
            updateDots();
        }

        function changePin() {
            var newPin = prompt("Enter a new 4-digit code:");
            if(newPin && newPin.length === 4 && !isNaN(newPin)) {
                localStorage.setItem("vault_pin", newPin);
                window.currentPin = newPin;
                alert("PIN successfully updated!");
                window.location.reload();
            } else if(newPin) {
                alert("Invalid configuration code. Please use 4 numbers.");
            }
        }

        function updateDots() {
            var pinDots = document.querySelectorAll('.dot');
            pinDots.forEach(function(dot, index) {
                if (index < window.pinInput.length) dot.classList.add('filled');
                else dot.classList.remove('filled');
            });
        }

        function verifyPin() {
            if (window.pinInput === window.currentPin) {
                document.getElementById('pin-screen').classList.remove('active');
                document.getElementById('vault-screen').classList.add('active');
            } else {
                alert("Incorrect PIN code.");
            }
            window.pinInput = "";
            updateDots();
        }

        function lockVault() {
            document.getElementById('vault-screen').classList.remove('active');
            document.getElementById('pin-screen').classList.add('active');
        }

        // Media Upload Mechanics
        function handleUpload(e) {
            var files = Array.from(e.target.files);
            if(!window.db) return alert("Database initializing...");
            
            var transaction = window.db.transaction(["media"], "readwrite");
            var store = transaction.objectStore("media");

            files.forEach(function(file) {
                var reader = new FileReader();
                reader.onload = function(event) {
                    store.add({
                        type: file.type.startsWith('video') ? 'video' : 'image',
                        data: event.target.result,
                        timestamp: Date.now()
                    });
                };
                reader.readAsDataURL(file);
            });

            transaction.oncomplete = function() { 
                setTimeout(loadGallery, 400); 
            };
        }

        // Gallery & Multi-Selection Panel
        function toggleSelectMode() {
            window.isSelectMode = !window.isSelectMode;
            document.getElementById('select-mode-btn').innerText = window.isSelectMode ? "Cancel" : "Select";
            document.getElementById('delete-btn').classList.add('hidden');
            window.selectedIds.clear();
            loadGallery();
        }

        function deleteSelected() {
            if (confirm("Permanently wipe out chosen file(s)?")) {
                var transaction = window.db.transaction(["media"], "readwrite");
                var store = transaction.objectStore("media");
                window.selectedIds.forEach(function(id) { store.delete(Number(id)); });
                transaction.oncomplete = function() {
                    window.isSelectMode = false;
document.getElementById('select-mode-btn').innerText = "Select";
document.getElementById('delete-btn').classList.add('hidden');
window.selectedIds.clear();
loadGallery();
};
}
}
// Fullscreen Viewer controls
function closeViewer() {
document.getElementById('viewer-screen').classList.add('hidden');
document.getElementById('viewer-content').innerHTML = "";
}
function loadGallery() {
var grid = document.getElementById('gallery-grid');
if (!window.db || !grid) return;
grid.innerHTML = "";
var store = window.db.transaction("media", "readonly").objectStore("media");
store.openCursor(null, "prev").onsuccess = function(e) {
var cursor = e.target.result;
if (cursor) {
var item = cursor.value;
var wrapper = document.createElement('div');
wrapper.className = window.isSelectMode ? 'thumbnail-wrapper selectable' : 'thumbnail-wrapper';
var media = document.createElement(item.type === 'video' ? 'video' : 'img');
media.src = item.data;
wrapper.appendChild(media);
wrapper.addEventListener('click', (function(id, type, data, el) {
return function() {
if (window.isSelectMode) {
if (window.selectedIds.has(id)) {
window.selectedIds.delete(id);
el.classList.remove('selected');
} else {
window.selectedIds.add(id);
el.classList.add('selected');
}
document.getElementById('delete-btn').classList.toggle('hidden', window.selectedIds.size === 0);
} else {
var viewer = document.getElementById('viewer-screen');
var target = document.getElementById('viewer-content');
target.innerHTML = "";
var viewMedia = document.createElement(type === 'video' ? 'video' : 'img');
viewMedia.src = data;
if(type === 'video') viewMedia.controls = true;
target.appendChild(viewMedia);
viewer.classList.remove('hidden');
}
};
})(item.id, item.type, item.data, wrapper));
grid.appendChild(wrapper);
cursor.continue();
}
};
}
