<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Photo Vault</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <!-- iOS Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

  <!-- PIN Screen -->
  <div id="pin-screen" class="screen flex-center">
    <div class="card">
      <h2 id="pin-title">Enter Vault PIN</h2>
      <div class="dots-container">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <div class="numpad">
        <button onclick="pressKey('1')">1</button><button onclick="pressKey('2')">2</button><button onclick="pressKey('3')">3</button>
        <button onclick="pressKey('4')">4</button><button onclick="pressKey('5')">5</button><button onclick="pressKey('6')">6</button>
        <button onclick="pressKey('7')">7</button><button onclick="pressKey('8')">8</button><button onclick="pressKey('9')">9</button>
        <button onclick="pressKey('C')">C</button><button onclick="pressKey('0')">0</button><button onclick="clearPin()">Clear</button>
      </div>
    </div>
  </div>

  <!-- Main Vault Dashboard -->
  <div id="vault-screen" class="screen hidden">
    <header>
      <h1>My Vault</h1>
      <div class="actions">
        <button id="multi-select-btn" onclick="toggleSelectMode()">Select</button>
        <button id="delete-btn" class="danger hidden" onclick="deleteSelected()">Delete</button>
        <button onclick="openSettings()">⚙️</button>
      </div>
    </header>

    <div id="gallery" class="grid"></div>

    <label class="fab-upload">
      +
      <input type="file" id="file-input" accept="image/*,video/*" multiple onchange="handleFiles(this.files)" style="display:none;">
    </label>
  </div>

  <!-- Settings View -->
  <div id="settings-screen" class="screen hidden">
    <header>
      <button onclick="showScreen('vault-screen')">← Back</button>
      <h1>Settings</h1>
    </header>
    <div class="settings-content">
      <button onclick="initiatePinChange()">Change 4-Digit PIN</button>
    </div>
  </div>

  <!-- Fullscreen Viewer -->
  <div id="viewer" class="hidden" onclick="closeViewer()">
    <div id="viewer-content" onclick="event.stopPropagation()"></div>
    <button class="close-viewer-btn" onclick="closeViewer()">✕</button>
  </div>

   <!-- Add HEIC to JPEG client-side converter -->
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="app.js"></script>
</body>

  <script src="app.js"></script>
</body>
</html>
