<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo Vault</title>
    <!-- PWA Capabilities for iOS -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vault">
    
    <style>
        :root {
            --bg-color: #0b0b0c;
            --card-bg: #1c1c1e;
            --accent-color: #0a84ff;
            --text-color: #ffffff;
            --danger-color: #ff453a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            background-color: var(--bg-color);
        }

        .screen.active {
            display: flex;
        }

        /* Header Layout */
        header {
            background-color: var(--card-bg);
            padding: 24px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2c2c2e;
        }

        h1 { font-size: 1.4rem; font-weight: 700; }

        .header-actions {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .icon-btn, .upload-lbl {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .text-danger { color: var(--danger-color); }
        .hidden { display: none !important; }

        /* Photo Gallery Grid Layout */
        .grid {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            padding: 3px;
        }

        .thumbnail-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%; /* Forces Uniform Perfect Squares */
            background-color: #141416;
            overflow: hidden;
        }

        .thumbnail-wrapper img, .thumbnail-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Selection Overlays */
        .thumbnail-wrapper.selectable::after {
            content: '';
            position: absolute;
            top: 8px;
            right: 8px;
            width: 22px;
            height: 22px;
            border: 2px solid white;
            border-radius: 50%;
            background: rgba(0,0,0,0.4);
        }

        .thumbnail-wrapper.selected::after {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* PIN Pad UI Screen */
        .pin-container {
            margin: auto;
            text-align: center;
            width: 280px;
        }

        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .dot {
            width: 14px;
            height: 14px;
            border: 2px solid #fff;
            border-radius: 50%;
        }

        .dot.filled { background-color: #fff; }

        .pin-keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .key {
            background-color: var(--card-bg);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 72px;
            height: 72px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .key:active { background-color: #3a3a3c; }
        .key.action-btn { font-size: 1.2rem; background: none; }

        /* Immersive Fullscreen Media Viewer */
        .viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .viewer-btn {
            position: absolute;
            top: 44px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: none;
            font-size: 2rem;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            z-index: 2010;
        }

        #viewer-content img, #viewer-content video {
            max-width: 100%;
            max-height: 100vh;
        }
    </style>
</head>
<body>

    <!-- PIN Screen -->
    <div id="pin-screen" class="screen active">
        <div class="pin-container">
            <h2 id="pin-title">Enter PIN</h2>
            <div class="pin-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
            <div class="pin-keypad">
                <button class="key">1</button><button class="key">2</button><button class="key">3</button>
                <button class="key">4</button><button class="key">5</button><button class="key">6</button>
                <button class="key">7</button><button class="key">8</button><button class="key">9</button>
                <button class="key action-btn" id="pin-clear">C</button>
                <button class="key">0</button>
                <button class="key action-btn" id="pin-mode-btn">⚙️</button>
            </div>
        </div>
    </div>

    <!-- Main Vault Screen -->
    <div id="vault-screen" class="screen">
        <header>
            <h1>My Vault</h1>
            <div class="header-actions">
                <button id="select-mode-btn" class="icon-btn">Select</button>
                <button id="delete-btn" class="icon-btn hidden text-danger">Delete</button>
                <label for="file-upload" class="icon-btn upload-lbl">+</label>
                <input type="file" id="file-upload" accept="image/*,video/*" multiple style="display:none;">
                <button id="lock-btn" class="icon-btn">🔒</button>
            </div>
        </header>

        <!-- Gallery Grid -->
        <main id="gallery-grid" class="grid"></main>
    </div>

    <!-- Fullscreen Viewer -->
    <div id="viewer-screen" class="viewer hidden">
        <button id="viewer-close" class="viewer-btn close-btn">&times;</button>
        <div id="viewer-content"></div>
    </div>

    <script>
        var currentPin = "1234";
        var pinInput = "";
        var isSelectMode = false;
        var selectedIds = new Set();
        var db;

        try {
            if (localStorage.getItem("vault_pin")) {
                currentPin = localStorage.getItem("vault_pin");
            } else {
                localStorage.setItem("vault_pin", "1234");
            }
        } catch (e) {
            console.log("Local storage fallback active.");
        }

        var dbRequest = indexedDB.open("PhotoVaultDB", 1);
        dbRequest.onupgradeneeded = function(e) {
            db = e.target.result;
            if (!db.objectStoreNames.contains("media")) {
                db.createObjectStore("media", { keyPath: "id", autoIncrement: true });
            }
        };
        dbRequest.onsuccess = function(e) { 
            db = e.target.result; 
            loadGallery(); 
        };

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(function(e) {});
        }

        document.addEventListener("DOMContentLoaded", function() {
            var pinDots = document.querySelectorAll('.dot');
            var pinScreen = document.getElementById('pin-screen');
            var vaultScreen = document.getElementById('vault-screen');

            document.querySelectorAll('.key').forEach(function(button) {
                button.addEventListener('click', function() {
                    var value = button.innerText;
                    if (!isNaN(value) && pinInput.length < 4) {
                        pinInput += value;
                        updateDots();
                        if (pinInput.length === 4) {
                            setTimeout(verifyPin, 150);
                        }
                    }
                });
            });

            document.getElementById('pin-clear').addEventListener('click', function() {
                pinInput = "";
                updateDots();
            });

            document.getElementById('pin-mode-btn').addEventListener('click', function() {
                var newPin = prompt("Enter your new 4-digit code:");
                if(newPin && newPin.length === 4 && !isNaN(newPin)) {
                    localStorage.setItem("vault_pin", newPin);
                    currentPin = newPin;
                    alert("PIN code successfully changed!");
                    window.location.reload();
                } else if(newPin) {
                    alert("Invalid entry. Must be exactly 4 numeric digits.");
                }
            });

            function updateDots() {
                pinDots.forEach(function(dot, index) {



                                if (index < pinInput.length) dot.classList.add('filled');
else dot.classList.remove('filled');
});
}
function verifyPin() {
if (pinInput === currentPin) {
pinScreen.classList.remove('active');
vaultScreen.classList.add('active');
} else {
alert("Incorrect PIN code.");
}
pinInput = "";
updateDots();
}
document.getElementById('lock-btn').addEventListener('click', function() {
vaultScreen.classList.remove('active');
pinScreen.classList.add('active');
});
document.getElementById('file-upload').addEventListener('change', function(e) {
var files = Array.from(e.target.files);
if(!db) return alert("Database initializing...");
var transaction = db.transaction(["media"], "readwrite");
var store = transaction.objectStore("media");
files.forEach(function(file) {
var reader = new FileReader();
reader.onload = function(event) {
store.add({
type: file.type.startsWith('video') ? 'video' : 'image',
data: event.target.result,
timestamp: Date.now()
});
};
reader.readAsDataURL(file);
});
transaction.oncomplete = function() {
setTimeout(loadGallery, 400);
};
});
document.getElementById('select-mode-btn').addEventListener('click', function() {
isSelectMode = !isSelectMode;
this.innerText = isSelectMode ? "Cancel" : "Select";
document.getElementById('delete-btn').classList.add('hidden');
selectedIds.clear();
loadGallery();
});
document.getElementById('delete-btn').addEventListener('click', function() {
if (confirm("Permanently delete selected item(s)?")) {
var transaction = db.transaction(["media"], "readwrite");
var store = transaction.objectStore("media");
selectedIds.forEach(function(id) { store.delete(Number(id)); });
transaction.oncomplete = function() {
isSelectMode = false;
document.getElementById('select-mode-btn').innerText = "Select";
document.getElementById('delete-btn').classList.add('hidden');
selectedIds.clear();
loadGallery();
};
}
});
document.getElementById('viewer-close').addEventListener('click', function() {
document.getElementById('viewer-screen').classList.add('hidden');
document.getElementById('viewer-content').innerHTML = "";
});
});
function loadGallery() {
var grid = document.getElementById('gallery-grid');
if (!db || !grid) return;
grid.innerHTML = "";
var store = db.transaction("media", "readonly").objectStore("media");
store.openCursor(null, "prev").onsuccess = function(e) {
var cursor = e.target.result;
if (cursor) {
var item = cursor.value;
var wrapper = document.createElement('div');
wrapper.className = isSelectMode ? 'thumbnail-wrapper selectable' : 'thumbnail-wrapper';
wrapper.dataset.id = item.id;
var media = document.createElement(item.type === 'video' ? 'video' : 'img');
media.src = item.data;
wrapper.appendChild(media);
wrapper.addEventListener('click', function() {
if (isSelectMode) {
if (selectedIds.has(item.id)) {
selectedIds.delete(item.id);
wrapper.classList.remove('selected');
} else {
selectedIds.add(item.id);
wrapper.classList.add('selected');
}
document.getElementById('delete-btn').classList.toggle('hidden', selectedIds.size === 0);
} else {
var viewer = document.getElementById('viewer-screen');
var target = document.getElementById('viewer-content');
target.innerHTML = "";
var viewMedia = document.createElement(item.type === 'video' ? 'video' : 'img');
viewMedia.src = item.data;
if(item.type === 'video') viewMedia.controls = true;
target.appendChild(viewMedia);
viewer.classList.remove('hidden');
}
});
grid.appendChild(wrapper);
cursor.continue();
}
};
}
