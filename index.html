<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo Vault</title>
    <!-- PWA Capabilities for iOS -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vault">
    
    <style>
        :root {
            --bg-color: #0b0b0c;
            --card-bg: #1c1c1e;
            --accent-color: #0a84ff;
            --text-color: #ffffff;
            --danger-color: #ff453a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            background-color: var(--bg-color);
        }

        .screen.active {
            display: flex;
        }

        /* Header Layout */
        header {
            background-color: var(--card-bg);
            padding: 24px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2c2c2e;
        }

        h1 { font-size: 1.4rem; font-weight: 700; }

        .header-actions {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .icon-btn, .upload-lbl {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .text-danger { color: var(--danger-color); }
        .hidden { display: none !important; }

        /* Photo Gallery Grid Layout */
        .grid {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            padding: 3px;
        }

        .thumbnail-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%; /* Forces Uniform Perfect Squares */
            background-color: #141416;
            overflow: hidden;
        }

        .thumbnail-wrapper img, .thumbnail-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Selection Overlays */
        .thumbnail-wrapper.selectable::after {
            content: '';
            position: absolute;
            top: 8px;
            right: 8px;
            width: 22px;
            height: 22px;
            border: 2px solid white;
            border-radius: 50%;
            background: rgba(0,0,0,0.4);
        }

        .thumbnail-wrapper.selected::after {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* PIN Pad UI Screen */
        .pin-container {
            margin: auto;
            text-align: center;
            width: 280px;
        }

        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .dot {
            width: 14px;
            height: 14px;
            border: 2px solid #fff;
            border-radius: 50%;
        }

        .dot.filled { background-color: #fff; }

        .pin-keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .key {
            background-color: var(--card-bg);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 72px;
            height: 72px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .key:active { background-color: #3a3a3c; }
        .key.action-btn { font-size: 1.2rem; background: none; }

        /* Immersive Fullscreen Media Viewer */
        .viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .viewer-btn {
            position: absolute;
            top: 44px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: none;
            font-size: 2rem;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            z-index: 2010;
        }

        #viewer-content img, #viewer-content video {
            max-width: 100%;
            max-height: 100vh;
        }
    </style>
</head>
<body>

    <!-- PIN Screen -->
    <div id="pin-screen" class="screen active">
        <div class="pin-container">
            <h2 id="pin-title">Enter PIN</h2>
            <div class="pin-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
            <div class="pin-keypad">
                <button class="key">1</button><button class="key">2</button><button class="key">3</button>
                <button class="key">4</button><button class="key">5</button><button class="key">6</button>
                <button class="key">7</button><button class="key">8</button><button class="key">9</button>
                <button class="key action-btn" id="pin-clear">C</button>
                <button class="key">0</button>
                <button class="key action-btn" id="pin-mode-btn">⚙️</button>
            </div>
        </div>
    </div>

    <!-- Main Vault Screen -->
    <div id="vault-screen" class="screen">
        <header>
            <h1>My Vault</h1>
            <div class="header-actions">
                <button id="select-mode-btn" class="icon-btn">Select</button>
                <button id="delete-btn" class="icon-btn hidden text-danger">Delete</button>
                <label for="file-upload" class="icon-btn upload-lbl">+</label>
                <input type="file" id="file-upload" accept="image/*,video/*" multiple style="display:none;">
                <button id="lock-btn" class="icon-btn">🔒</button>
            </div>
        </header>

        <!-- Gallery Grid -->
        <main id="gallery-grid" class="grid"></main>
    </div>

    <!-- Fullscreen Viewer -->
    <div id="viewer-screen" class="viewer hidden">
        <button id="viewer-close" class="viewer-btn close-btn">&times;</button>
        <div id="viewer-content"></div>
    </div>

    <script>
        var currentPin = "1234";
        var pinInput = "";
        var isSelectMode = false;
        var selectedIds = new Set();
        var db = null;

        // Load baseline setup instructions after the elements finish loading
        document.addEventListener("DOMContentLoaded", function() {
            var pinDots = document.querySelectorAll('.dot');
            var pinScreen = document.getElementById('pin-screen');
            var vaultScreen = document.getElementById('vault-screen');

            // Set up fallback for localStorage tracking security parameters
            try {
                if (localStorage.getItem("vault_pin")) {
                    currentPin = localStorage.getItem("vault_pin");
                } else {
                    localStorage.setItem("vault_pin", "1234");
                }
            } catch (e) {
                console.log("Local storage isolation mode active.");
            }

            // Database setup initialization logic inside structured closure
            var dbRequest = indexedDB.open("PhotoVaultDB", 1);
            dbRequest.onupgradeneeded = function(e) {
                var localDb = e.target.result;
                if (!localDb.objectStoreNames.contains("media")) {
                    localDb.createObjectStore("media", { keyPath: "id", autoIncrement: true });
                }
            };
            dbRequest.onsuccess = function(e) { 
                db = e.target.result; 
                loadGallery(); 
            };
            dbRequest.onerror = function(e) {
                console.error("Local database verification failure.");
            };

            // Setup Keypad Number Button listeners
            document.querySelectorAll('.key').forEach(function(button) {
                button.addEventListener('click', function() {
                    var value = button.innerText;
                    if (!isNaN(value) && pinInput.length < 4) {
                        pinInput += value;
                        updateDots();
                        if (pinInput.length === 4) {
                            setTimeout(verifyPin, 150);
                        }
                    }
                });
            });

            document.getElementById('pin-clear').addEventListener('click', function() {
                pinInput = "";
                updateDots();
            });

            document.getElementById('pin-mode-btn').addEventListener('click', function() {
                var newPin = prompt("Enter your new 4-digit code:");
                if(newPin && newPin.length === 4 && !isNaN(newPin)) {
                    localStorage.setItem("vault_pin", newPin);
