<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo Vault</title>
    <link rel="stylesheet" href="styles.css">
    <!-- PWA Capabilities for iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vault">
</head>
<body>

    <!-- PIN Screen -->
    <div id="pin-screen" class="screen active">
        <div class="pin-container">
            <h2 id="pin-title">Enter PIN</h2>
            <div class="pin-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
            <div class="pin-keypad">
                <button class="key">1</button><button class="key">2</button><button class="key">3</button>
                <button class="key">4</button><button class="key">5</button><button class="key">6</button>
                <button class="key">7</button><button class="key">8</button><button class="key">9</button>
                <button class="key action-btn" id="pin-clear">C</button>
                <button class="key">0</button>
                <button class="key action-btn" id="pin-mode-btn">⚙️</button>
            </div>
        </div>
    </div>

    <!-- Main Vault Screen -->
    <div id="vault-screen" class="screen">
        <header>
            <h1>My Vault</h1>
            <div class="header-actions">
                <button id="select-mode-btn" class="icon-btn">Select</button>
                <button id="delete-btn" class="icon-btn hidden text-danger">Delete</button>
                <label for="file-upload" class="icon-btn upload-lbl">+</label>
                <input type="file" id="file-upload" accept="image/*,video/*" multiple style="display:none;">
                <button id="lock-btn" class="icon-btn">🔒</button>
            </div>
        </header>

        <!-- Gallery Grid -->
        <main id="gallery-grid" class="grid"></main>
    </div>

    <!-- Fullscreen Viewer -->
    <div id="viewer-screen" class="viewer hidden">
        <button id="viewer-close" class="viewer-btn close-btn">&times;</button>
        <div id="viewer-content"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
