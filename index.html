<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Vault</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Modern PWA Meta Tags for iOS -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vault">
</head>
<body>

    <!-- 1. PIN Screen -->
    <div id="pin-screen" class="screen active">
        <div class="vault-icon">🔒</div>
        <h2 id="pin-title">Enter PIN</h2>
        <div class="pin-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="keypad">
            <button class="key" onclick="pressKey('1')">1</button>
            <button class="key" onclick="pressKey('2')">2</button>
            <button class="key" onclick="pressKey('3')">3</button>
            <button class="key" onclick="pressKey('4')">4</button>
            <button class="key" onclick="pressKey('5')">5</button>
            <button class="key" onclick="pressKey('6')">6</button>
            <button class="key" onclick="pressKey('7')">7</button>
            <button class="key" onclick="pressKey('8')">8</button>
            <button class="key" onclick="pressKey('9')">9</button>
            <button class="key" onclick="pressKey('C')">C</button>
            <button class="key" onclick="pressKey('0')">0</button>
            <button class="key" onclick="pressKey('back')">⌫</button>
        </div>
    </div>

    <!-- 2. Main Vault Screen -->
    <div id="vault-screen" class="screen">
        <header>
            <h1>My Vault</h1>
            <div class="header-actions">
                <button id="select-mode-btn" class="icon-btn">Select</button>
                <button id="settings-btn" class="icon-btn">⚙️</button>
            </div>
        </header>

        <!-- Bulk Action Bar -->
        <div id="bulk-bar" class="bulk-bar hidden">
            <span id="selected-count">0 items selected</span>
            <div class="bulk-actions">
                <button id="delete-selected-btn" class="danger-btn">Delete</button>
                <button id="cancel-select-btn" class="secondary-btn">Cancel</button>
            </div>
        </div>

        <!-- Media Grid -->
        <main id="media-grid" class="grid"></main>

        <!-- Floating Add Button -->
        <label for="file-upload" class="floating-btn">
            <span>+</span>
            <input type="file" id="file-upload" accept="image/*,video/*" multiple hidden>
        </label>
    </div>

    <!-- 3. Full-Screen Viewer -->
    <div id="viewer-screen" class="viewer hidden">
        <button id="close-viewer" class="viewer-close">✕</button>
        <div id="viewer-content"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
