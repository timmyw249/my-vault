<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Vault</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Modern PWA Meta Tags for iOS -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vault">
</head>
<body>

    <!-- 1. PIN Screen -->
    <div id="pin-screen" class="screen active">
        <div class="vault-icon">🔒</div>
        <h2 id="pin-title">Enter PIN</h2>
        <div class="pin-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="keypad" id="vault-keypad">
            <button class="key" data-key="1">1</button>
            <button class="key" data-key="2">2</button>
            <button class="key" data-key="3">3</button>
            <button class="key" data-key="4">4</button>
            <button class="key" data-key="5">5</button>
            <button class="key" data-key="6">6</button>
            <button class="key" data-key="7">7</button>
            <button class="key" data-key="8">8</button>
            <button class="key" data-key="9">9</button>
            <button class="key" data-key="C">C</button>
            <button class="key" data-key="0">0</button>
            <button class="key" data-key="back">⌫</button>
        </div>
    </div>

    <!-- 2. Main Vault Screen -->
    <div id="vault-screen" class="screen">
        <header>
            <h1>My Vault</h1>
            <div class="header-actions">
                <button id="select-mode-btn" class="icon-btn">Select</button>
                <button id="settings-btn" class="icon-btn">⚙️</button>
            </div>
        </header>

        <!-- Bulk Action Bar -->
        <div id="bulk-bar" class="bulk-bar hidden">
            <span id="selected-count">0 items selected</span>
            <div class="bulk-actions">
                <button id="delete-selected-btn" class="danger-btn">Delete</button>
                <button id="cancel-select-btn" class="secondary-btn">Cancel</button>
            </div>
        </div>

        <!-- Media Grid -->
        <main id="media-grid" class="grid"></main>

        <!-- Floating Add Button -->
        <label for="file-upload" class="floating-btn">
            <span>+</span>
            <input type="file" id="file-upload" accept="image/*,video/*" multiple hidden>
        </label>
    </div>

    <!-- 3. Full-Screen Viewer -->
    <div id="viewer-screen" class="viewer hidden">
        <button id="close-viewer" class="viewer-close">✕</button>
        <div id="viewer-content"></div>
    </div>

    <!-- Embedded Application Code Core -->
    <script>
    const dbName = "PhotoVaultDB";
    let db;

    const initDB = () => {
        return new Promise((resolve) => {
            let request = indexedDB.open(dbName, 1);
            request.onupgradeneeded = (e) => {
                db = e.target.result;
                db.createObjectStore("media", { keyPath: "id", autoIncrement: true });
            };
            request.onsuccess = (e) => {
                db = e.target.result;
                resolve();
            };
        });
    };

    let currentPin = "";
    let isSelectMode = false;
    let selectedIds = new Set();
    let isResettingPin = false;

    let galleryItems = [];
    let currentViewerIndex = -1;

    let touchStartX = 0;
    let touchEndX = 0;
    let initialDistance = 0;
    let currentScale = 1;
    let lastScale = 1;

    const pinScreen = document.getElementById('pin-screen');
    const vaultScreen = document.getElementById('vault-screen');
    const viewerScreen = document.getElementById('viewer-screen');
    const pinTitle = document.getElementById('pin-title');
    const dots = document.querySelectorAll('.dot');
    const mediaGrid = document.getElementById('media-grid');
    const bulkBar = document.getElementById('bulk-bar');
    const selectedCountText = document.getElementById('selected-count');
    const viewerContent = document.getElementById('viewer-content');

    // Keypad Logic bound programmatically to avoid window object reference drops
    function handleKeypadPress(key) {
        if (key === 'C') {
            currentPin = "";
        } else if (key === 'back') {
            currentPin = currentPin.slice(0, -1);
        } else if (currentPin.length < 4) {
            currentPin += key;
        }
        
        updatePinDots();

        if (currentPin.length === 4) {
            setTimeout(handlePinEntry, 200);
        }
    }

    function updatePinDots() {
        dots.forEach((dot, index) => {
            if (index < currentPin.length) dot.classList.add('filled');
            else dot.classList.remove('filled');
        });
    }

    function handlePinEntry() {
        const savedPin = localStorage.getItem('vault_pin');

        if (isResettingPin) {
            localStorage.setItem('vault_pin', currentPin);
            alert("PIN changed successfully!");
            isResettingPin = false;
            pinTitle.innerText = "Enter PIN";
            currentPin = "";
            updatePinDots();
            return;
        }

        if (currentPin === savedPin) {
            pinScreen.classList.remove('active');
            vaultScreen.classList.add('active');
            currentPin = "";
            updatePinDots();
        } else {
            alert("Incorrect PIN");
            currentPin = "";
            updatePinDots();
        }
    }

    document.getElementById('settings-btn').addEventListener('click', () => {
        if (confirm("Would you like to change your 4-digit PIN?")) {
            vaultScreen.classList.remove('active');
            pinScreen.classList.add('active');
            pinTitle.innerText = "Enter New PIN";
            isResettingPin = true;
        }
    });

    document.getElementById('file-upload').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        const processFile = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function () {
                    const tx = db.transaction("media", "readwrite");
                    const store = tx.objectStore("media");
                    
                    store.add({
                        type: file.type.startsWith('video/') ? 'video' : 'image',
                        data: reader.result,
                        timestamp: Date.now()
                    });
                    
                    tx.oncomplete = () => resolve();
                };
            });
        };

        for (let file of files) {
            await processFile(file);
        }

        renderGallery();
        e.target.value = ""; 
    });

    function renderGallery() {
        mediaGrid.innerHTML = "";
        galleryItems = []; 
        const tx = db.transaction("media", "readonly");
        const store = tx.objectStore("media");
        
        store.openCursor(null, "prev").onsuccess = function(e) {
            const cursor = e.target.result;
            if (cursor) {
                const item = cursor.value;
                galleryItems.push(item); 
                
                const wrapper = document.createElement('div');
                wrapper.className = 'thumbnail-wrapper';
                wrapper.dataset.id = item.id;

                if (item.type === 'video') {
                    const video = document.createElement('video');
                    video.src = item.data;
                    video.muted = true;
                    video.playsInline = true;
                    wrapper.appendChild(video);
                    
                    const badge = document.createElement('div');
                    badge.className = 'video-badge';
                    badge.innerText = '▶';
                    wrapper.appendChild(badge);
                } else {
                    const img = document.createElement('img');
                    img.src = item.data;
                    wrapper.appendChild(img);
                }

                const overlay = document.createElement('div');
                overlay.className = 'select-overlay';
                overlay.innerHTML = '<div class="checkbox-indicator"></div>';
                wrapper.appendChild(overlay);

                wrapper.addEventListener('click', () => handleItemClick(item, wrapper));
                mediaGrid.appendChild(wrapper);
                cursor.continue();
            }
        };
    }

    function handleItemClick(item, element) {
        if (isSelectMode) {
            const id = parseInt(element.dataset.id);
            if (selectedIds.has(id)) {
                selectedIds.delete(id);
                element.classList.remove('selected');
            } else {
                selectedIds.add(id);
                element.classList.add('selected');
            }
            selectedCountText.innerText = `${selectedIds.size} items selected`;
        } else {
            currentViewerIndex = galleryItems.findIndex(g => g.id === item.id);
            openFullScreenViewer(item);
        }
    }

    function openFullScreenViewer(item) {
        viewerContent.innerHTML = "";
        currentScale = 1;
        lastScale = 1;

        let mediaElement;
        if (item.type === 'video') {
            mediaElement = document.createElement('video');
            mediaElement.src = item.data;
            mediaElement.controls = true;
            mediaElement.autoplay = true;
        } else {
            mediaElement = document.createElement('img');

mediaElement.src = item.data;
}
mediaElement.style.transform = scale(${currentScale});
mediaElement.style.transition = "transform 0.1s ease-out";
viewerContent.appendChild(mediaElement);
viewerScreen.classList.remove('hidden');
}
function setupGestures() {
viewerScreen.addEventListener('touchstart', (e) => {
if (e.touches.length === 1 && currentScale === 1) {
const singleTouch = e.touches.item(0);
if (singleTouch) {
touchStartX = singleTouch.clientX;
}
}
if (e.touches.length === 2) {
const mediaElement = viewerContent.querySelector('img');
if (mediaElement) {
const finger1 = e.touches.item(0);
const finger2 = e.touches.item(1);
if (finger1 && finger2) {
initialDistance = Math.hypot(
finger1.clientX - finger2.clientX,
finger1.clientY - finger2.clientY
);
}
}
}
}, { passive: true });
viewerScreen.addEventListener('touchmove', (e) => {
if (e.touches.length === 1 && currentScale === 1) {
const singleTouch = e.touches.item(0);
if (singleTouch) {
touchEndX = singleTouch.clientX;
}
}
if (e.touches.length === 2 && initialDistance > 0) {
const mediaElement = viewerContent.querySelector('img');
if (mediaElement) {
const finger1 = e.touches.item(0);
const finger2 = e.touches.item(1);
if (finger1 && finger2) {
const currentDistance = Math.hypot(
finger1.clientX - finger2.clientX,
finger1.clientY - finger2.clientY
);
currentScale = Math.min(Math.max(1, lastScale * (currentDistance / initialDistance)), 4);
mediaElement.style.transform = scale(${currentScale});
}
}
}
}, { passive: true });
viewerScreen.addEventListener('touchend', (e) => {
if (e.touches.length < 2) {
initialDistance = 0;
lastScale = currentScale;
}
if (currentScale === 1 && touchStartX !== 0 && touchEndX !== 0) {
const swipeDistance = touchEndX - touchStartX;
const threshold = 60;
if (Math.abs(swipeDistance) > threshold) {
if (swipeDistance > 0) {
if (currentViewerIndex > 0) {
currentViewerIndex--;
openFullScreenViewer(galleryItems[currentViewerIndex]);
}
} else {
if (currentViewerIndex < galleryItems.length - 1) {
currentViewerIndex++;
openFullScreenViewer(galleryItems[currentViewerIndex]);
}
}
}
}
touchStartX = 0;
touchEndX = 0;
}, { passive: true });
}
document.getElementById('close-viewer').addEventListener('click', () => {
viewerScreen.classList.add('hidden');
viewerContent.innerHTML = "";
currentScale = 1;
lastScale = 1;
});
const selectModeBtn = document.getElementById('select-mode-btn');
selectModeBtn.addEventListener('click', () => {
isSelectMode = true;
mediaGrid.classList.add('select-mode');
bulkBar.classList.remove('hidden');
selectedIds.clear();
selectedCountText.innerText = "0 items selected";
});
function exitSelectMode() {
isSelectMode = false;
mediaGrid.classList.remove('select-mode');
bulkBar.classList.add('hidden');
document.querySelectorAll('.thumbnail-wrapper').forEach(el => el.classList.remove('selected'));
selectedIds.clear();
}
document.getElementById('cancel-select-btn').addEventListener('click', exitSelectMode);
document.getElementById('delete-selected-btn').addEventListener('click', () => {
if (selectedIds.size === 0) return;
if (confirm(Are you sure you want to permanently delete these ${selectedIds.size} items?)) {
const tx = db.transaction("media", "readwrite");
const store = tx.objectStore("media");
selectedIds.forEach(id => store.delete(id));
tx.oncomplete = () => {
exitSelectMode();
renderGallery();
};
}
});
// Execute application configuration setup safely on runtime entry
window.addEventListener('DOMContentLoaded', async () => {
await initDB();
if (!localStorage.getItem('vault_pin')) {
localStorage.setItem('vault_pin', '1234');
}
// Loop and attach direct click listeners inside the programmatic block
document.querySelectorAll('#vault-keypad .key').forEach(button => {
button.addEventListener('click', () => {
const keyValue = button.getAttribute('data-key');
handleKeypadPress(keyValue);
});
});
renderGallery();
setupGestures();
});
